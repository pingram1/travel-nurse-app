name: Weekly Client Progress Report

on:
  schedule:
    # Fridays at 5:00 PM US Eastern Standard Time (22:00 UTC).
    # During daylight saving (EDT), this fires at 6:00 PM Eastern — adjust to "0 21 * * 5" if preferred.
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview report without sending email'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate-and-send-report:
    name: Generate & Email Weekly Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and send weekly report
        env:
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
          REPORT_CC_EMAILS: ${{ secrets.REPORT_CC_EMAILS }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          REPORT_CLIENT_NAME: ${{ vars.REPORT_CLIENT_NAME }}
          REPORT_PROJECT_NAME: ${{ vars.REPORT_PROJECT_NAME }}
          REPORT_DEVELOPER_NAME: ${{ vars.REPORT_DEVELOPER_NAME }}
          REPORT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CI: true
        run: npm run report:weekly

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: error
